[project]
name = "munim-backend"
version = "0.1.0"
description = "Munim backend: WhatsApp AI sales agent for Indian MSMEs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "structlog>=24.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "pypdf>=7.1.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.33",
  "pyyaml>=6.0.3",
  "tzdata>=2026.6",
  "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "testcontainers[postgres]>=4.8",
  "psycopg2-binary>=2.9",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0.12.20261113",
  "types-openpyxl>=3.1.5.20261017",
  "hypothesis>=6.170.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]
ignore = ["S101"]  # asserts are fine in tests; app code does not use them for validation

[tool.ruff.lint.isort]
known-first-party = ["app", "seeds", "benchmark"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test passwords/tokens are fake
"app/orchestrator/messages.py" = ["E501"]  # translated sentences, kept on one line each
"seeds/data.py" = ["E501"]  # demo text

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "fastembed.*", "docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]  # backend/ for app and seeds, repo root for benchmark
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]
