[project]
name = "munim-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "email-validator>=2.2,<3",
    "argon2-cffi>=23,<26",
    "pyjwt>=2.10,<3",
    "httpx>=0.28,<1",
    "redis>=5,<6",
    "arq>=0.26,<1",
    "structlog>=25,<26",
    "jinja2>=3.1,<4",
    "pgvector>=0.4,<1",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4,<5",
    "cryptography>=44,<48",
]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "testcontainers[postgres]>=4.10,<5",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pytest-socket>=0.7,<1",
    "psycopg[binary]>=3.2,<4",
    "types-openpyxl>=3.1",
    "types-reportlab>=5.0.0.20261008",
]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
