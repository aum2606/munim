[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# URL comes from DATABASE_URL (app settings) or is set programmatically; never put credentials here.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
