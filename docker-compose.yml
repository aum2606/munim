services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: munim
      POSTGRES_USER: munim
      POSTGRES_PASSWORD: munim
    ports: ["57432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munim"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    env_file: .env
    environment: &backend_environment
      DATABASE_URL: postgresql+asyncpg://munim:munim@postgres:5432/munim
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: ./backend
    env_file: .env
    environment: *backend_environment
    volumes: ["uploads:/app/uploads"]
    ports: ["18000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build: ./backend
    env_file: .env
    environment: *backend_environment
    volumes: ["uploads:/app/uploads"]
    command: ["uv", "run", "arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }
  widget:
    build:
      context: .
      dockerfile: widget/Dockerfile
    ports: ["5174:5174"]
volumes:
  postgres_data:
  uploads:
