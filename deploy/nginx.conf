# Serves the dashboard and proxies the API and the WhatsApp webhook. Nothing else is exposed.
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 12m;  # uploads are capped at 10 MB by the API, with room for the form
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /webhooks/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {  # file names carry a content hash, so they can be cached for good
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;  # client-side routes
    }
}
